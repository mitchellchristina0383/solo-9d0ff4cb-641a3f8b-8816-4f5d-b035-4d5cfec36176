services:
  packager:
    build: .
    image: ci-packager:local
    container_name: ci-packager
    ports:
      - "${PACKAGER_PORT:-8000}:8000"
    environment:
      CI_PACKAGER_DATA_DIR: /data
      CI_PACKAGER_MAX_FILES: "20"
      CI_PACKAGER_MAX_FILE_BYTES: "2097152"
      CI_PACKAGER_MAX_TOTAL_BYTES: "5242880"
    volumes:
      - packager-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  packager-data:
